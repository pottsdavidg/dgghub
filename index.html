<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ground Game Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Roboto+Condensed:wght@400;500;700&family=Alexandria:wght@900&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: fixed brand sidebar (Impact Black + isometric wordmark) beside a light working canvas; Democracy Lab gated by tier. */
:root{
  --blue:#1144FF; --red:#FF0F43; --yellow:#FFC800; --white:#FBFCFF; --black:#242424;
  --bg:#EEF1FA; --surface:#FBFCFF; --surface2:#F4F6FD; --ink:#242424; --muted:#596079; --line:#DCE1F0;
  --link:#1144FF; --blueSoft:#E3EAFF; --redSoft:#FFE3EA; --yellowSoft:#FFF4CC; --greenSoft:#DDF5E6; --green:#13824A;
  --shadow:#242424; --sloganShadow:#C9CFE3; --sloganAccent:#FF0F43;
  --display:"Staatliches","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --head:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --wordmark:"Alexandria","Arial Black",Impact,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18191D; --surface:#242424; --surface2:#2C2D32; --ink:#FBFCFF; --muted:#A6ABBE; --line:#3A3C44;
  --link:#7C98FF; --blueSoft:#1D2754; --redSoft:#4A1622; --yellowSoft:#40360F; --greenSoft:#163A27; --green:#5FD394; --shadow:#000; --sloganShadow:#0B0C0E; --sloganAccent:#FFC800; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18191D; --surface:#242424; --surface2:#2C2D32; --ink:#FBFCFF; --muted:#A6ABBE; --line:#3A3C44;
  --link:#7C98FF; --blueSoft:#1D2754; --redSoft:#4A1622; --yellowSoft:#40360F; --greenSoft:#163A27; --green:#5FD394; --shadow:#000; --sloganShadow:#0B0C0E; --sloganAccent:#FFC800; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95}
.label{font:700 12px/1 var(--head);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--mono)}
.tab-nums{font-variant-numeric:tabular-nums}

/* isometric pattern + wordmark */
.patwrap{position:relative;overflow:hidden;isolation:isolate}
.pat{position:absolute;top:50%;left:50%;width:2600px;transform:translate(-50%,-50%) rotate(-30deg) skewX(30deg) scaleY(.866);
  font:900 44px/1.02 var(--wordmark);color:rgba(255,255,255,.13);white-space:nowrap;pointer-events:none;z-index:-1;user-select:none}
.pat.dark{color:rgba(255,255,255,.05)}
.tilebg::before{content:"";position:absolute;inset:0;z-index:-1;background:url(pattern-tile.png) center/700px repeat;mix-blend-mode:screen;opacity:.22;pointer-events:none}
.pat div:nth-child(3n+2){margin-left:-180px}.pat div:nth-child(3n){margin-left:-360px}
.wm{display:inline-block;font:900 var(--wms,30px)/.86 var(--wordmark);color:var(--white);transform:rotate(-30deg) skewX(30deg) scaleY(.866);
  text-shadow:.07em .07em 0 var(--wmshadow,var(--blue))}
.wm span{display:block}.wm span:nth-child(2){margin-left:.55em}.wm span:nth-child(3){margin-left:1.1em}

/* ===== AUTH ===== */
#auth{position:relative;min-height:100%;display:flex;justify-content:center;background:var(--blue) url(massive-tile.webp) center/cover no-repeat}
.auth-form{width:70%;min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);border-left:2px solid var(--black);border-right:2px solid var(--black);box-shadow:0 0 60px rgba(0,0,0,.35);padding-block:48px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px}
.tagline{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:34px}
.slogan{font-family:var(--display);font-size:clamp(48px,6vw,80px);line-height:.9;color:var(--ink);text-shadow:4px 4px 0 var(--sloganShadow)}
.slogan .r{color:var(--sloganAccent)}
.tagline p{max-width:42ch;font-size:17px;margin:0;color:var(--muted)}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{flex:1;border:0;background:transparent;padding:10px;font:700 15px var(--head);text-transform:uppercase;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:2px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:2px}
.field input:focus{border-color:var(--blue);outline:0}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tier{border:2px solid var(--line);background:var(--surface);text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.tier[aria-pressed="true"]{border-color:var(--blue);box-shadow:5px 5px 0 var(--blue)}
.tier b{font:400 24px/1 var(--display)}
.tier small{color:var(--muted);font-size:14px;line-height:1.35}
.tier .price{font:700 13px var(--head);text-transform:uppercase;letter-spacing:.05em;color:var(--link)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);padding:10px 16px;font:700 15px/1 var(--head);text-transform:uppercase;letter-spacing:.06em;border-radius:2px;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.block{width:100%;padding:14px}
.live{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:2px solid var(--ink);background:var(--surface);box-shadow:5px 5px 0 var(--red)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--blue) url(pattern-tile.png) center/420px;background-blend-mode:screen;overflow:hidden;display:grid;place-items:center;color:#fff}
.thumb::before{content:"";position:absolute;inset:0;background:var(--tint,rgba(17,68,255,.82))}
.thumb>*{position:relative}
.thumb.k{--tint:rgba(36,36,36,.9)}.thumb.r{--tint:rgba(255,15,67,.85)}.thumb.y{--tint:rgba(255,200,0,.88);color:var(--black)}
.thumb .playbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--black);display:grid;place-items:center;box-shadow:3px 3px 0 var(--black)}
.thumb .playbtn svg{width:24px;height:24px}
.thumb .ttag{position:absolute;left:10px;top:10px;font:700 11px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;background:var(--black);color:#fff;padding:5px 7px}
.thumb .ttag.on{background:var(--red)}
.thumb .dur{position:absolute;right:10px;bottom:10px;font:500 12px var(--mono);background:rgba(0,0,0,.75);color:#fff;padding:3px 6px}
.thumb .big{font:400 clamp(28px,4vw,44px)/.9 var(--display);text-align:center;padding:0 24px;text-shadow:3px 3px 0 rgba(0,0,0,.6)}
.live .side-info{padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.live .side-info h2{font:400 30px/1 var(--display);letter-spacing:.02em}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--surface);padding:0;display:flex;flex-direction:column;border-radius:2px;overflow:hidden}
.mcard:hover{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.mcard .mi{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.mcard b{font:700 16px/1.25 var(--head)}
.mcard .d{font-size:13px;color:var(--muted)}
.themebtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:2px;font:700 12px/1 var(--head);text-transform:uppercase;letter-spacing:.06em}
.themebtn:hover{border-color:var(--ink)}
.themebtn svg{width:16px;height:16px}
.auththeme{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:3;box-shadow:3px 3px 0 var(--black)}
.lead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lead .portrait{width:84px;height:84px;font-size:38px;background:var(--blue);box-shadow:4px 4px 0 var(--black)}
.lead h2{font:400 32px/1 var(--display);letter-spacing:.02em}
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.contact .mono{background:var(--surface2);border:1px solid var(--line);padding:5px 8px;user-select:all}
.nochap{border:2px solid var(--ink);background:var(--surface);box-shadow:6px 6px 0 var(--yellow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.nochap .pitch{background:var(--black);color:var(--white);padding:28px;display:flex;flex-direction:column;gap:14px}
.nochap .pitch h2{font:400 clamp(34px,4vw,48px)/.92 var(--display);letter-spacing:.02em}
.nochap .pitch h2 span{color:var(--yellow)}
.nochap .pitch ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.nochap .pitch li{display:flex;gap:8px;font-size:15px}
.nochap .pitch li svg{width:18px;height:18px;flex:none;color:var(--yellow);margin-top:2px}
.nochap form{padding:24px;display:flex;flex-direction:column;gap:14px}
.field textarea{border:2px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:2px;font:inherit;color:inherit;resize:vertical;min-height:90px}
.daily{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:2px solid var(--ink);background:var(--surface);box-shadow:5px 5px 0 var(--yellow)}
.daily .art{background:var(--black) url(pattern-tile.png) center/420px;background-blend-mode:screen;position:relative;padding:26px;color:#fff;display:flex;flex-direction:column;gap:12px;justify-content:flex-end;min-height:220px}
.daily .art::before{content:"";position:absolute;inset:0;background:rgba(17,68,255,.84)}
.daily .art>*{position:relative}
.daily .art h2{font:400 clamp(40px,5vw,60px)/.88 var(--display);letter-spacing:.02em;text-shadow:4px 4px 0 var(--black)}
.daily .art h2 span{color:var(--yellow)}
.daily .meta{padding:22px;display:flex;flex-direction:column;gap:12px}
.streak{display:flex;gap:6px}
.streak i{flex:1;height:30px;border:2px solid var(--ink);display:grid;place-items:center;font:700 11px var(--head);font-style:normal;color:var(--muted)}
.streak i.on{background:var(--yellow);color:var(--black)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.game{text-align:left;border:2px solid var(--ink);background:var(--surface);padding:0;display:flex;flex-direction:column;border-radius:2px;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.game:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--blue)}
.game .gart{height:96px;display:grid;place-items:center;font:400 44px/1 var(--display);color:#fff;letter-spacing:.03em}
.game .gi{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.game .gi b{font:400 24px/1 var(--display);letter-spacing:.03em}
.game .gi span{font-size:14px;color:var(--muted);line-height:1.35}
.play{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qprog{display:flex;gap:4px}.qprog i{flex:1;height:6px;background:var(--line)}.qprog i.on{background:var(--blue)}
.qcard{border:2px solid var(--ink);background:var(--surface);padding:22px;box-shadow:5px 5px 0 var(--blue);display:flex;flex-direction:column;gap:14px}
.qcard h2{font:700 22px/1.25 var(--head)}
.opt{border:2px solid var(--line);background:var(--surface);padding:12px 14px;text-align:left;font:500 16px var(--body);border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--green);background:var(--greenSoft)}
.opt.wrong{border-color:var(--red);background:var(--redSoft)}
.opt:disabled{cursor:default}
.tlrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:2px solid var(--ink);background:var(--surface);padding:10px 12px}
.tlrow.right{border-color:var(--green);background:var(--greenSoft)}.tlrow.wrong{border-color:var(--red);background:var(--redSoft)}
.tlrow .yr{font:400 24px/1 var(--display);width:56px;text-align:center;color:var(--link)}
.tlrow .mv{display:flex;gap:4px}
.tlrow .mv button{border:2px solid var(--line);background:var(--surface2);width:34px;height:34px;display:grid;place-items:center;border-radius:2px}
.tlrow .mv button svg{width:16px;height:16px}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{accent-color:var(--blue);width:100%}
.slider .top{display:flex;justify-content:space-between;font-size:14px}
.slider .top b{font-family:var(--mono);font-weight:500}
.prob{display:flex;height:36px;border:2px solid var(--ink)}
.prob div{display:flex;align-items:center;padding:0 10px;font:700 14px var(--head);color:#fff;white-space:nowrap;overflow:hidden;transition:width .3s}
.rating{font:700 12px/1 var(--head);text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border-radius:2px}
.wsfeat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border:2px solid var(--ink);background:var(--surface);box-shadow:5px 5px 0 var(--blue)}
.wsfeat .wart{background:var(--black);color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:200px}
.wsfeat .wart h2{font:400 clamp(32px,4vw,46px)/.92 var(--display);letter-spacing:.02em}
.wsfeat .wart h2 span{color:var(--yellow)}
.wsfeat .winfo{padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.presenter{display:flex;align-items:center;gap:10px}
.presenter .avatar{width:40px;height:40px}
.tracks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.track{text-align:left;border:2px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;border-radius:2px}
.track[aria-pressed="true"]{border-color:var(--ink);box-shadow:4px 4px 0 var(--track,var(--blue))}
.track b{font:400 22px/1 var(--display);letter-spacing:.03em}
.track span{font-size:13px;color:var(--muted);line-height:1.35}
.track .bar{height:6px}
.demo-note{font-size:13px;color:var(--muted);border-left:3px solid var(--yellow);padding-left:10px}

/* ===== SHELL ===== */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.side{background:var(--black);color:var(--white);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-head{padding:30px 20px 34px;border-bottom:1px solid #3a3a3a}
.side-head .side-logo{display:block;width:170px;height:auto;filter:drop-shadow(3px 3px 0 var(--blue))}
.tilebg.dark::before{opacity:.09;background-size:520px}
.side nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px;flex:1}
.navgroup{font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:#9a9ca6;padding:16px 10px 6px;display:flex;align-items:center;gap:8px}
.pro{background:var(--yellow);color:var(--black);font:700 10px/1 var(--head);padding:3px 5px;letter-spacing:.08em}
.freetag{margin-left:auto;border:1px solid var(--yellow);color:var(--yellow);font:700 10px/1 var(--head);padding:3px 5px;letter-spacing:.08em;text-transform:uppercase}
.samplebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--ink);background:var(--yellowSoft);padding:10px 14px}
.samplebar .msg{flex:1 1 300px;font-size:14px;line-height:1.4}
.samplebar .msg b{font:700 15px var(--head)}
.samplebar .btn{padding:7px 11px;font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#d9dbe4;padding:9px 10px;text-align:left;font:500 16px var(--head);border-radius:2px;position:relative}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:#2f2f2f;color:#fff}
.navbtn[aria-current="page"]{background:var(--blue);color:#fff}
.navdrop .chev{margin-left:auto;width:16px;height:16px;transform:rotate(-90deg);transition:transform .15s;opacity:.7}
.navdrop[aria-expanded="true"] .chev{transform:rotate(90deg)}
.navdrop.has-cur{color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.navsub{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 19px;padding-left:10px;border-left:1px solid #3a3a3a}
.navbtn.sub{font-size:15px;padding:7px 10px}
.navbtn .lk{margin-left:auto;width:14px;height:14px;opacity:.6}
.side-foot{padding:14px 16px;border-top:1px solid #3a3a3a;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--head);background:var(--red);color:#fff;flex:none}
.side-foot .who{min-width:0;flex:1;line-height:1.2}
.side-foot .who b{display:block;font:700 14px var(--head)}
.side-foot .who span{font-size:12px;color:#9a9ca6}
.iconbtn{border:0;background:transparent;color:inherit;padding:6px;display:grid;place-items:center;border-radius:2px}
.iconbtn:hover{background:#3a3a3a}
.iconbtn svg{width:18px;height:18px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.menubtn{display:none;color:var(--ink)}
.menubtn:hover{background:var(--surface2)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:7px 10px;background:var(--surface2);border-radius:2px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.viewas{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.viewas .seg{border-width:2px}
.viewas .seg button{padding:6px 10px;font-size:12px}
.content{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1180px;display:flex;flex-direction:column;gap:24px}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h1{font:400 clamp(36px,4.5vw,52px)/.95 var(--display);letter-spacing:.02em}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.crumb{border:0;background:none;color:var(--link);font:700 13px var(--head);text-transform:uppercase;letter-spacing:.06em;padding:0;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.crumb svg{width:14px;height:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font:700 18px var(--head);text-transform:uppercase;letter-spacing:.04em}
.panel-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}

function go(v,p=null){for(const k in S.openDrops){const el=document.getElementById('drop-'+k);if(el&&el.querySelector(`[data-go="${v}"]`))delete S.openDrops[k]}if(v!==S.view&&v==='games')S.game=null;S.view=v;S.param=p;renderApp()}

 const app=$('#app');
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.p||null));

 bindTheme();
 app.querySelectorAll('[data-drop]').forEach(gt=>gt.onclick=()=>{const id=gt.dataset.drop,o=gt.getAttribute('aria-expanded')==='true';S.openDrops[id]=!o;gt.setAttribute('aria-expanded',String(!o));$('#drop-'+id).hidden=o;gt.classList.toggle('has-cur',o&&!!document.querySelector('#drop-'+id+' [aria-current]'))});
 app.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
 $('#signout').onclick=()=>{$('#app').hidden=true;$('#auth').hidden=false;S.mode='signin';renderAuth()};
 const side=$('#side'),scrim=$('#scrim');

}

 chapter(){document.querySelectorAll('[data-chap]').forEach(b=>b.onclick=()=>{S.hasChapter=b.dataset.chap==='1';renderApp()});
  const c=$('#copyEmail');if(c)c.onclick=()=>{const t='columbus@digitalgroundgame.org';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Email copied')).catch(()=>{const r=document.createRange();r.selectNodeContents(c.previousElementSibling);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Email selected. Press Ctrl+C to copy.')})};

function drawModel(){
 const r=RACES.find(x=>x.id===S.race)||RACES[0];
 const adj=S.turnout*0.45+S.swing*2.2;
 const pts=r.trend.map((v,i)=>i===r.trend.length-1?Math.min(99,Math.max(1,v+adj)):v);
 const fin=pts[pts.length-1],[rt,c]=rateOf(fin);
 $('#racename').textContent=r.name;
 const rr=$('#raterating');rr.textContent=rt;rr.className='chip '+c;
 $('#mdem').textContent=r.dem;$('#mrep').textContent=r.rep;$('#mcon').textContent=r.contacts;
 $('#probbar').innerHTML=`<div style="width:${fin}%;background:var(--blue)">DEM ${fin.toFixed(1)}%</div><div style="width:${100-fin}%;background:var(--red);justify-content:flex-end">${(100-fin).toFixed(1)}% REP</div>`;
 const W=600,H=230,L=40,R=16,T=12,B=28,iw=W-L-R,ih=H-T-B;
 const x=i=>L+i*iw/(pts.length-1),y=v=>T+ih-(v-20)/60*ih;
 const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
 const area=line+`L${x(pts.length-1)},${y(20)}L${x(0)},${y(20)}Z`;
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Win probability trend ending at ${fin.toFixed(1)} percent">
  ${[20,35,50,65,80].map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t===50?'stroke-dasharray="4 4" stroke-width="1.5"':''}/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Roboto Mono, monospace">${t}%</text>`).join('')}
  <path d="${area}" fill="var(--blue)" opacity=".12"/>
  <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(pts.length-1)}" cy="${y(fin)}" r="6" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>
  ${pts.map((_,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Roboto Mono, monospace">Wk ${i+1}</text>`:'').join('')}
 </svg>`;
}
