<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ground Game Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Roboto+Condensed:wght@400;500;700&family=Alexandria:wght@900&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: fixed brand sidebar (Impact Black + isometric wordmark) beside a light working canvas; organizer suite gated by tier. */
:root{
  --blue:#1144FF; --red:#FF0F43; --yellow:#FFC800; --white:#FBFCFF; --black:#242424;
  --bg:#EEF1FA; --surface:#FBFCFF; --surface2:#F4F6FD; --ink:#242424; --muted:#596079; --line:#DCE1F0;
  --link:#1144FF; --blueSoft:#E3EAFF; --redSoft:#FFE3EA; --yellowSoft:#FFF4CC; --greenSoft:#DDF5E6; --green:#13824A;
  --shadow:#242424;
  --display:"Staatliches","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --head:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --wordmark:"Alexandria","Arial Black",Impact,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18191D; --surface:#242424; --surface2:#2C2D32; --ink:#FBFCFF; --muted:#A6ABBE; --line:#3A3C44;
  --link:#7C98FF; --blueSoft:#1D2754; --redSoft:#4A1622; --yellowSoft:#40360F; --greenSoft:#163A27; --green:#5FD394; --shadow:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18191D; --surface:#242424; --surface2:#2C2D32; --ink:#FBFCFF; --muted:#A6ABBE; --line:#3A3C44;
  --link:#7C98FF; --blueSoft:#1D2754; --redSoft:#4A1622; --yellowSoft:#40360F; --greenSoft:#163A27; --green:#5FD394; --shadow:#000; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95}
.label{font:700 12px/1 var(--head);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--mono)}
.tab-nums{font-variant-numeric:tabular-nums}

/* isometric pattern + wordmark */
.patwrap{position:relative;overflow:hidden;isolation:isolate}
.pat{position:absolute;top:50%;left:50%;width:2600px;transform:translate(-50%,-50%) rotate(-30deg) skewX(30deg) scaleY(.866);
  font:900 44px/1.02 var(--wordmark);color:rgba(255,255,255,.13);white-space:nowrap;pointer-events:none;z-index:-1;user-select:none}
.pat.dark{color:rgba(255,255,255,.05)}
.tilebg::before{content:"";position:absolute;inset:0;z-index:-1;background:url(pattern-tile.png) center/700px repeat;mix-blend-mode:screen;opacity:.22;pointer-events:none}
.pat div:nth-child(3n+2){margin-left:-180px}.pat div:nth-child(3n){margin-left:-360px}
.wm{display:inline-block;font:900 var(--wms,30px)/.86 var(--wordmark);color:var(--white);transform:rotate(-30deg) skewX(30deg) scaleY(.866);
  text-shadow:.07em .07em 0 var(--wmshadow,var(--blue))}
.wm span{display:block}.wm span:nth-child(2){margin-left:.55em}.wm span:nth-child(3){margin-left:1.1em}

/* ===== AUTH ===== */
#auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-brand{background:var(--blue) url(massive-tile.webp) center/cover no-repeat;color:var(--white);padding-block:48px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;min-height:100%}
.auth-brand .brandcopy{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:100%;padding:28px clamp(20px,4vw,40px);border-radius:24px;background:rgba(136,148,198,.21);-webkit-backdrop-filter:blur(18px) saturate(155%);backdrop-filter:blur(18px) saturate(155%);border:1px solid rgba(255,255,255,.31);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 36px rgba(0,0,0,.24)}
.slogan{font-family:var(--display);font-size:clamp(48px,6vw,84px);line-height:.9;text-shadow:4px 4px 0 var(--black)}
.slogan .r{color:var(--red)}
.auth-brand p{max-width:44ch;font-size:18px;margin:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.auth-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{flex:1;border:0;background:transparent;padding:10px;font:700 15px var(--head);text-transform:uppercase;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:2px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:2px}
.field input:focus{border-color:var(--blue);outline:0}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tier{border:2px solid var(--line);background:var(--surface);text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.tier[aria-pressed="true"]{border-color:var(--blue);box-shadow:5px 5px 0 var(--blue)}
.tier b{font:400 24px/1 var(--display)}
.tier small{color:var(--muted);font-size:14px;line-height:1.35}
.tier .price{font:700 13px var(--head);text-transform:uppercase;letter-spacing:.05em;color:var(--link)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);padding:10px 16px;font:700 15px/1 var(--head);text-transform:uppercase;letter-spacing:.06em;border-radius:2px;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.block{width:100%;padding:14px}
.demo-note{font-size:13px;color:var(--muted);border-left:3px solid var(--yellow);padding-left:10px}

/* ===== SHELL ===== */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.side{background:var(--black);color:var(--white);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-head{padding:30px 20px 34px;border-bottom:1px solid #3a3a3a}
.side-head .side-logo{display:block;width:170px;height:auto;filter:drop-shadow(3px 3px 0 var(--blue))}
.tilebg.dark::before{opacity:.09;background-size:520px}
.side nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px;flex:1}
.navgroup{font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:#9a9ca6;padding:16px 10px 6px;display:flex;align-items:center;gap:8px}
.pro{background:var(--yellow);color:var(--black);font:700 10px/1 var(--head);padding:3px 5px;letter-spacing:.08em}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#d9dbe4;padding:9px 10px;text-align:left;font:500 16px var(--head);border-radius:2px;position:relative}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:#2f2f2f;color:#fff}
.navbtn[aria-current="page"]{background:var(--blue);color:#fff}
.navbtn .lk{margin-left:auto;width:14px;height:14px;opacity:.6}
.side-foot{padding:14px 16px;border-top:1px solid #3a3a3a;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--head);background:var(--red);color:#fff;flex:none}
.side-foot .who{min-width:0;flex:1;line-height:1.2}
.side-foot .who b{display:block;font:700 14px var(--head)}
.side-foot .who span{font-size:12px;color:#9a9ca6}
.iconbtn{border:0;background:transparent;color:inherit;padding:6px;display:grid;place-items:center;border-radius:2px}
.iconbtn:hover{background:#3a3a3a}
.iconbtn svg{width:18px;height:18px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.menubtn{display:none;color:var(--ink)}
.menubtn:hover{background:var(--surface2)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:7px 10px;background:var(--surface2);border-radius:2px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:0}
.search svg{width:16px;height:16px;color:var(--muted)}
.viewas{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.viewas .seg{border-width:2px}
.viewas .seg button{padding:6px 10px;font-size:12px}
.content{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1180px;display:flex;flex-direction:column;gap:24px}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h1{font:400 clamp(36px,4.5vw,52px)/.95 var(--display);letter-spacing:.02em}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.crumb{border:0;background:none;color:var(--link);font:700 13px var(--head);text-transform:uppercase;letter-spacing:.06em;padding:0;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.crumb svg{width:14px;height:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font:700 18px var(--head);text-transform:uppercase;letter-spacing:.04em}
.panel-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--head);text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border-radius:2px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.blue{background:var(--blueSoft);color:var(--link)}
.chip.red{background:var(--redSoft);color:var(--red)}
.chip.yel{background:var(--yellowSoft);color:var(--ink)}
.chip.green{background:var(--greenSoft);color:var(--green)}
.chip svg{width:12px;height:12px}
.party{width:24px;height:24px;display:inline-grid;place-items:center;font:700 12px var(--head);color:#fff;border-radius:2px;flex:none}
.party.D{background:var(--blue)}.party.R{background:var(--red)}.party.I{background:var(--yellow);color:var(--black)}.party.N{background:var(--muted)}
.sample{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:3px 7px}

/* hero countdown */
.hero{background:var(--blue);color:var(--white);padding:28px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;border-radius:2px}
.hero .big{font:400 clamp(72px,10vw,120px)/.8 var(--display);text-shadow:5px 5px 0 var(--black)}
.hero .big small{display:block;font-size:.3em;line-height:1;margin-top:10px;text-shadow:none;letter-spacing:.06em}
.hero h2{font:400 34px/1 var(--display);letter-spacing:.03em}
.hero p{margin:6px 0 0;max-width:52ch;opacity:.92}
.hero .btn{border-color:var(--black)}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.stat .v{font:400 34px/1 var(--display);letter-spacing:.02em}
.stat .s{font-size:14px;color:var(--muted);line-height:1.35}
.stat .v.ok{color:var(--green)}

.donate{border:2px solid var(--ink);background:var(--yellowSoft);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative}
.donate h3{font:700 19px var(--head)}
.donate p{margin:4px 0 0;font-size:15px;max-width:72ch}
.amts{display:flex;gap:8px;flex-wrap:wrap}
.amt{border:2px solid var(--ink);background:var(--surface);padding:8px 14px;font:700 15px var(--head)}
.amt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.close{position:absolute;top:6px;right:6px}
.close svg{width:16px;height:16px}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rows>.row:first-child{border-top:0}
button.row:hover{background:var(--surface2)}
.row .t{font:700 16px/1.25 var(--head)}
.row .d{font-size:14px;color:var(--muted);line-height:1.35}
.row .ic{width:36px;height:36px;display:grid;place-items:center;border-radius:2px;background:var(--blueSoft);color:var(--link)}
.row .ic svg{width:18px;height:18px}
.row .ic.red{background:var(--redSoft);color:var(--red)}
.row .ic.yel{background:var(--yellowSoft);color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;}
.kv>div{padding:10px 0;border-top:1px solid var(--line)}
.kv>div:nth-child(-n+2){border-top:0}
.kv dt,.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:700 15px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}

.repcard{display:flex;flex-direction:column;gap:12px;padding:18px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.repcard:hover{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.repcard .top{display:flex;gap:12px;align-items:center}
.portrait{width:52px;height:52px;border-radius:2px;display:grid;place-items:center;font:400 24px var(--display);color:#fff;flex:none;background:var(--black)}
.repcard b{font:700 18px/1.15 var(--head);display:block}
.repcard .off{font-size:14px;color:var(--muted)}
.repcard .meta{display:flex;gap:6px;flex-wrap:wrap}

/* pipeline */
.pipe{display:flex;gap:3px}
.pipe i{flex:1;height:6px;background:var(--line);border-radius:1px}
.pipe i.on{background:var(--blue)}
.pipe i.fail{background:var(--red)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pipeline div{padding:10px 8px 8px;border-top:6px solid var(--line);font:700 12px/1.2 var(--head);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pipeline div.on{border-color:var(--blue);color:var(--ink)}
.pipeline div.cur{border-color:var(--red);color:var(--ink)}
.pipeline div small{display:block;font:400 12px var(--body);text-transform:none;letter-spacing:0;margin-top:3px;color:var(--muted)}

.timeline{display:flex;flex-direction:column;position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 18px}
.tl:before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.tl.red:before{border-color:var(--red)}
.tl .when{font:500 12px var(--mono);color:var(--muted)}
.tl .what{font-weight:500}

.diff{font:400 15px/1.6 var(--body);border:1px solid var(--line);background:var(--surface2);padding:14px 16px}
.diff p{margin:0 0 10px}.diff p:last-child{margin:0}
.diff del{background:var(--redSoft);color:var(--red);text-decoration:line-through}
.diff ins{background:var(--greenSoft);color:var(--green);text-decoration:none}
.diff .sec{font:500 12px var(--mono);color:var(--muted);margin-right:6px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:700 12px var(--head);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbtn{border:2px solid var(--line);background:var(--surface);padding:6px 12px;font:700 13px var(--head);text-transform:uppercase;letter-spacing:.05em;border-radius:2px}
.fbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* module chrome */
.modbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--black);color:var(--white);padding:12px 16px;border-radius:2px}
.modbar .dot{width:8px;height:8px;border-radius:50%;background:#2fd47a;box-shadow:0 0 0 3px rgba(47,212,122,.25)}
.modbar code{font:500 13px var(--mono);color:#b9bdd0}
.modbar .btn{margin-left:auto;box-shadow:none;border-color:var(--white);background:transparent;color:var(--white)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surface2);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h3{font:700 13px var(--head);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;color:var(--muted);padding:2px 4px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.kcard.hi{border-left-color:var(--red)}.kcard.md{border-left-color:var(--yellow)}
.kcard b{font:700 15px/1.25 var(--head)}
.kcard .id{font:500 12px var(--mono);color:var(--muted)}
.kcard:hover{border-color:var(--blue)}

.wikigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wcard{text-align:left;border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;border-radius:2px}
.wcard:hover{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.wcard .h{display:flex;gap:10px;align-items:center}
.wcard .h b{font:700 17px/1.15 var(--head);display:block}
.wcard .h span{font:500 12px var(--mono);color:var(--muted)}
.wcard p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.article{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.article h2{font:700 20px var(--head);border-bottom:1px solid var(--line);padding-bottom:6px;margin:22px 0 10px}
.article p{max-width:68ch;margin:0 0 12px}
.infobox{border:2px solid var(--ink);background:var(--surface)}
.infobox .ttl{background:var(--black);color:var(--white);padding:10px 14px;font:400 22px var(--display);letter-spacing:.03em}
.infobox .kv{padding:4px 14px 10px;grid-template-columns:110px 1fr;font-size:14px}
.cite{font:500 11px var(--mono);color:var(--link);vertical-align:super}

.chartbox svg{width:100%;height:auto;display:block}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{accent-color:var(--blue);width:100%}
.slider .top{display:flex;justify-content:space-between;font-size:14px}
.slider .top b{font-family:var(--mono);font-weight:500}
.prob{display:flex;height:34px;border:2px solid var(--ink)}
.prob div{display:flex;align-items:center;padding:0 10px;font:700 14px var(--head);color:#fff;white-space:nowrap;overflow:hidden;transition:width .3s}

.locked{position:relative;overflow:hidden;border-radius:2px}
.locked .ghost{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.lockcard{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.lockcard>div{background:var(--surface);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--blue);padding:24px;max-width:440px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.lockcard h2{font:400 32px/1 var(--display);letter-spacing:.02em}
.lockcard p{margin:0;color:var(--muted)}

.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.plan{background:var(--surface);border:2px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px}
.plan.feat{border-color:var(--ink);box-shadow:7px 7px 0 var(--blue)}
.plan h2{font:400 36px/1 var(--display);letter-spacing:.02em}
.plan .pr{font:400 44px/1 var(--display)}
.plan .pr small{font:500 15px var(--body);color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.plan li svg{width:18px;height:18px;flex:none;color:var(--green);margin-top:2px}
.plan .btn{margin-top:auto}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 18px;border-left:5px solid var(--yellow);font:500 15px var(--head);opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.article{grid-template-columns:1fr}.infobox{order:-1}}
@media (max-width:900px){
  #auth{grid-template-columns:1fr}
  .auth-brand{min-height:auto;padding-block:36px 300px;justify-content:flex-start;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));background-size:max(100%,760px) auto;background-position:center bottom -200px}
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);height:100%}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .menubtn{display:grid}
  .g3,.g2{grid-template-columns:1fr}.span2{grid-column:auto}
  .hero{grid-template-columns:1fr;gap:16px}
  .plans{grid-template-columns:1fr}
  .viewas>span{display:none}
}
@media (max-width:600px){
  .g4{grid-template-columns:1fr 1fr}
  .tiers{grid-template-columns:1fr}
  .donate{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:1fr}.kv>div:nth-child(odd){padding-bottom:0;}.kv>div:nth-child(even){border-top:0;padding-top:2px}
  .search{display:none}
  .content,.topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const party=p=>`<span class="party ${p}" title="${{D:'Democrat',R:'Republican',I:'Independent',N:'Nonpartisan'}[p]}">${p==='N'?'NP':p}</span>`;
const pipe=s=>`<div class="pipe" aria-label="${STAGES[s]}">${STAGES.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
const modbar=(name,host)=>`<div class="modbar"><span class="dot"></span><b class="label" style="color:#fff">Connected module</b><span>${name}</span><code>${host}</code><button class="btn sm" data-toast="Would open the full ${name} app in a new tab">${ic('ext')}Open full app</button></div>`;

courts(){

models(){

/* ---------- per-view behavior ---------- */
function commonHooks(){
 document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{S.amt=+b.dataset.amt;renderApp()});
 const g=$('#give');if(g)g.onclick=()=>toast(`Thank you! A $${S.amt} donation would be processed here.`);
 const u=$('#upgrade');if(u)u.onclick=()=>{S.tier='organizer';renderApp();toast('Welcome to the Organizer suite. Trial started.')};
 const h=$('#hidedonate');if(h)h.onclick=()=>{S.donate=false;renderApp()};
}
const HOOKS={
 home:commonHooks,plans:commonHooks,leg:commonHooks,courts:commonHooks,
 register(){$('#lookup').onsubmit=e=>{e.preventDefault();const n=($('#lk-first').value+' '+$('#lk-last').value).trim()||'That voter';toast(`${n}: Active registration found in ${$('#lk-state').value} (sample result)`)}},
 reps(){document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{S.repLvl=b.dataset.lvl;renderApp()})},
 bills(){document.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{S.billF=b.dataset.bf;renderApp()});
  const q=$('#billq');q.oninput=()=>{S.billQ=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{renderApp();const n=$('#billq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}},
 bill(){document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{S.ver=+b.dataset.ver;renderApp()});
  $('#followbill').onclick=()=>{const b=BILLS.find(x=>x.id===S.param)||BILLS[0];b.follow=!b.follow;renderApp();toast(b.follow?'Following '+b.num+'. You\'ll get an alert when it moves.':'Unfollowed '+b.num)}},
 wiki(){commonHooks();const q=$('#wikiq');if(!q)return;q.oninput=()=>{S.wikiQ=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{renderApp();const n=$('#wikiq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}},
 models(){commonHooks();if(S.tier!=='organizer')return;
  document.querySelectorAll('[data-race]').forEach(b=>b.onclick=()=>{S.race=b.dataset.race;renderApp()});
  const y=$('#youth'),s=$('#swing');
  const upd=()=>{S.youth=+y.value;S.swing=+s.value;$('#youthv').textContent=(S.youth>=0?'+':'')+S.youth+' pts';$('#swingv').textContent=(S.swing>0?'+':'')+S.swing+' pts';drawModel()};
  y.oninput=upd;s.oninput=upd;upd();},
};
HOOKS.ballot=()=>{};HOOKS.history=()=>{};HOOKS.rep=()=>{};HOOKS.article=()=>{};

function drawModel(){
 const r=RACES.find(x=>x.id===S.race);
 const adj=S.youth*0.45+S.swing*2.2;
 const pts=r.trend.map((v,i)=>i===r.trend.length-1?Math.min(99,Math.max(1,v+adj)):v);
 const fin=pts[pts.length-1];
 $('#racename').textContent=r.name;
 $('#probbar').innerHTML=`<div style="width:${fin}%;background:var(--blue)">DEM ${fin.toFixed(1)}%</div><div style="width:${100-fin}%;background:var(--red);justify-content:flex-end">${(100-fin).toFixed(1)}% REP</div>`;
 const W=600,H=230,L=40,R=16,T=12,B=28,iw=W-L-R,ih=H-T-B;
 const x=i=>L+i*iw/(pts.length-1),y=v=>T+ih-(v-20)/60*ih; // y domain 20–80
 const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
 const area=line+`L${x(pts.length-1)},${y(20)}L${x(0)},${y(20)}Z`;
 const ticks=[20,35,50,65,80];
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Win probability trend ending at ${fin.toFixed(1)} percent">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t===50?'stroke-dasharray="4 4" stroke-width="1.5"':''}/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Roboto Mono, monospace">${t}%</text>`).join('')}
  <path d="${area}" fill="var(--blue)" opacity=".12"/>
  <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="${x(pts.length-1)}" cy="${y(fin)}" r="6" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>
  ${pts.map((_,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Roboto Mono, monospace">Wk ${i+1}</text>`:'').join('')}
 </svg>`;
}
