<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ground Game Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Roboto+Condensed:wght@400;500;700&family=Alexandria:wght@900&family=Roboto+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/dgg.css">

<!--
  Ground Game Hub · HTMX prototype
  ─────────────────────────────────
  index.html      → templates/base.html (just the root + toast + scripts)
  css/dgg.css     → static/css/dgg.css  (unchanged in production)
  js/mock-server.js → DELETE in production (stands in for FastAPI)
  js/data.js      → SQLite seed data
  js/views.js     → Jinja2 templates
  js/routes.js    → FastAPI routes
-->
<div id="root" hx-get="/" hx-trigger="load"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/mock-server.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
<script src="js/data.js"></script>
<script src="js/views.js"></script>
<script src="js/routes.js"></script>
<script>
  /* Client-side glue that stays in production (static/js/ui.js). */
  htmx.config.historyEnabled = false;
  window.ui = {
    menu(open) {
      const side = document.getElementById('side'), scrim = document.querySelector('.scrim');
      if (side) side.classList.toggle('open', open);
      if (scrim) scrim.classList.toggle('open', open);
    },
    toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
    },
    theme(t) {
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      else delete document.documentElement.dataset.theme;
    },
    copy(text, btn) {
      const done = () => ui.toast('Copied ' + text);
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ui.toast('Selected. Press Ctrl+C to copy.'); };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    },
  };
  // Server-sent events via the HX-Trigger response header
  document.body.addEventListener('toast', e => ui.toast(e.detail.value));
  document.body.addEventListener('set-theme', e => ui.theme(e.detail.value));
  document.body.addEventListener('htmx:afterSwap', () => ui.menu(false));
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-ui]');
    if (m) ui.menu(m.dataset.ui === 'menu-open');
    const c = e.target.closest('[data-copy]');
    if (c) ui.copy(c.dataset.copy, c);
  });
</script>

</body></html>
